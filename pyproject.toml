[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joplin-mcp-wrapper"
version = "0.1.0"
description = "Kubernetes-ready wrapper for the alondmnt/joplin-mcp MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "joplin-mcp==0.2.3",
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.34.0",
]
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

[project.scripts]
joplin-mcp-wrapper = "joplin_mcp_wrapper.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/joplin_mcp_wrapper"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "dagger-io>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
