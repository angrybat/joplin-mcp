[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joplin-mcp-wrapper"
version = "0.1.0"
description = "Kubernetes-ready wrapper for the alondmnt/joplin-mcp MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "joplin-mcp==0.7.1",
    "fastmcp==2.14.7",
    "starlette==1.0.0",
    "uvicorn[standard]==0.46.0",
]
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

[project.scripts]
joplin-mcp-wrapper = "joplin_mcp_wrapper.main:run"

[project.optional-dependencies]
unit-tests = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/joplin_mcp_wrapper"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "dagger-io==0.20.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
